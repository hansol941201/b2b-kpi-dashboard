<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B2B 통합 KPI 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  color-scheme: light;
  --navy: #1d3a6b; --navy-2: #2c5394; --navy-wash: #eaf0f9;
  --bg: #f3f5f8; --surface: #ffffff; --surface-2: #f6f8fb; --line: #e2e7ee; --grid: #edf0f4;
  --ink: #14202f; --ink-2: #475467; --ink-3: #7a8597;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #9aa5b5; --s1-wash: rgba(42,120,214,.10);
  --good: #0b8a3e; --warn: #a86400; --crit: #c23b3b; --wait: #5f6b7a; --ref: #4f6482;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: "Pretendard Variable", Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%; word-break: keep-all; overflow-wrap: anywhere; }
button, input, select { font: inherit; }
a { color: var(--navy-2); }
header.top { background: var(--navy); color: #fff; }
header.top .in { max-width: 1240px; margin: 0 auto; padding: 18px 20px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
header.top h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.4px; }
header.top .sub { font-size: 13.5px; opacity: .82; margin-top: 2px; }
.stat { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13.5px; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.28); border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: #5fd38d; display: inline-block; }
.pill.stale i { background: #ffb547; } .pill.err i { background: #ff7b7b; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--navy); font-weight: 600; cursor: pointer; text-decoration: none; }
.btn.light { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.35); }
.btn.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
.btn:disabled { opacity: .55; cursor: wait; }
nav.tabs { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: 0 1px 0 rgba(20,32,47,.02); }
nav.tabs .in { max-width: 1240px; margin: 0 auto; display: flex; gap: 4px; overflow-x: auto; padding: 0 12px; scrollbar-width: none; }
nav.tabs .in::-webkit-scrollbar { display: none; }
nav.tabs button { flex: 0 0 auto; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--ink-2); font-size: 15.5px; font-weight: 600; padding: 14px 14px 11px; min-height: 52px; cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--navy); border-bottom-color: var(--navy); }
main { max-width: 1240px; margin: 0 auto; padding: 22px 20px 8px; }
section.page { display: none; } section.page.on { display: block; }
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px; margin: 2px 0 16px; }
.ph h2 { margin: 0; font-size: 22px; letter-spacing: -.4px; color: var(--ink); }
.ph p { margin: 4px 0 0; color: var(--ink-2); font-size: 14.5px; }
h3.sec { font-size: 17px; margin: 26px 0 10px; color: var(--navy); letter-spacing: -.2px; }
.grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 700px) { .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1040px) { .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } .g21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; }
.card > h4 { margin: 0; font-size: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.card > .cap { color: var(--ink-3); font-size: 13px; margin: 3px 0 12px; }
.card.click { cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.card.click:hover, .card.click:focus-visible { border-color: var(--navy-2); box-shadow: 0 4px 16px rgba(29,58,107,.10); outline: none; }
.kpi .k { font-size: 14px; color: var(--ink-2); font-weight: 600; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; }
.kpi .v { font-size: 34px; font-weight: 800; letter-spacing: -1px; line-height: 1.15; margin: 10px 0 4px; font-variant-numeric: tabular-nums; color: var(--ink); }
.kpi .v.na { font-size: 24px; color: var(--wait); letter-spacing: -.4px; }
.kpi .v.need { font-size: 24px; color: var(--crit); letter-spacing: -.4px; }
.kpi .d { font-size: 14px; color: var(--ink-2); }
.kpi .more { margin-top: 10px; font-size: 13px; color: var(--navy-2); font-weight: 600; }
.up { color: var(--good); font-weight: 700; } .down { color: var(--crit); font-weight: 700; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; line-height: 1.5; }
.b-ok { color: var(--good); } .b-ref { color: var(--ref); } .b-ver { color: var(--warn); } .b-no { color: var(--crit); } .b-wait { color: var(--wait); } .b-op { color: var(--ink-3); }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 900px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.tile .k { font-size: 13px; color: var(--ink-2); }
.tile .v { font-size: 24px; font-weight: 800; letter-spacing: -.6px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.tile .d { font-size: 13px; color: var(--ink-2); line-height: 1.45; margin-top: 2px; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; }
.filters label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-2); font-weight: 600; min-width: 0; }
.filters select, .filters input[type=search], .filters input[type=text] { min-height: 44px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); font-size: 15px; min-width: 0; max-width: 100%; }
.filters .grow { flex: 1 1 220px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: #fff; color: var(--ink-2); border-radius: 999px; padding: 7px 14px; font-size: 14px; min-height: 40px; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--ink-2); margin: 0 0 6px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--ink-2); font-size: 12px; font-family: inherit; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .lbl { fill: var(--ink); font-size: 12px; font-weight: 700; }
.basis { font-size: 12.5px; color: var(--ink-3); margin-top: 8px; }
.tip { position: absolute; pointer-events: none; background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13px; box-shadow: 0 6px 18px rgba(20,32,47,.14); white-space: nowrap; z-index: 50; display: none; }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 10px 11px; border-bottom: 1px solid var(--grid); text-align: left; vertical-align: top; }
th { background: var(--surface-2); color: var(--ink-2); font-weight: 600; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
td, th { overflow-wrap: normal; word-break: keep-all; } td:first-child { min-width: 7.5em; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
details.more { margin-top: 10px; } details.more > summary { cursor: pointer; color: var(--navy-2); font-size: 14px; font-weight: 600; padding: 6px 0; min-height: 36px; list-style-position: inside; }
.note { font-size: 13px; color: var(--ink-3); margin: 8px 0 0; }
.callout { border: 1px solid #f1d9b5; background: #fff8ee; padding: 12px 14px; border-radius: 12px; font-size: 14px; color: #6b4a12; margin: 0 0 16px; }
.callout.red { border-color: #f2c4c4; background: #fff4f4; color: #7a2323; }
.callout.blue { border-color: #cddcf2; background: var(--navy-wash); color: #1d3a6b; }
.list { margin: 0; padding: 0; list-style: none; }
.list li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--grid); font-size: 14.5px; }
.list li:last-child { border-bottom: 0; }
.list .go { margin-left: auto; flex: 0 0 auto; }
.steps { display: grid; gap: 8px; }
.step { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
.step .no { width: 30px; height: 30px; border-radius: 50%; background: var(--navy-wash); color: var(--navy); font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.step .t { font-size: 14.5px; font-weight: 600; } .step .s { font-size: 12.5px; color: var(--ink-3); }
.step .val { text-align: right; font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.step .bar { grid-column: 2 / 4; height: 8px; background: var(--grid); border-radius: 4px; overflow: hidden; }
.step .bar span { display: block; height: 100%; background: var(--s1); border-radius: 4px; }
.step.na .val { color: var(--crit); font-size: 15px; }
.scale { position: relative; height: 34px; margin: 12px 0 4px; }
.scale .track { position: absolute; left: 0; right: 0; top: 14px; height: 8px; border-radius: 4px; background: var(--grid); }
.scale .mk { position: absolute; top: 4px; width: 2px; height: 28px; background: var(--ink-3); }
.scale .mk span { position: absolute; top: -2px; left: 6px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.tgt { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tgt span { font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; color: var(--ink-2); }
.firm-res { display: grid; gap: 8px; }
.firm-res button { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 12px 14px; cursor: pointer; display: grid; gap: 2px; min-height: 52px; }
.firm-res button[aria-current="true"] { border-color: var(--navy); box-shadow: inset 3px 0 0 var(--navy); }
.firm-res .nm { font-weight: 700; } .firm-res .meta { font-size: 13px; color: var(--ink-3); }
.lv { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .lv { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.lv .card h5 { margin: 0 0 6px; font-size: 15px; color: var(--navy); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 14px; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.empty { color: var(--ink-3); font-size: 14px; }
.state { max-width: 640px; margin: 60px auto; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 32px 24px; }
.state h2 { margin: 0 0 8px; font-size: 22px; } .state p { color: var(--ink-2); }
.spin { width: 36px; height: 36px; border: 4px solid var(--navy-wash); border-top-color: var(--navy); border-radius: 50%; margin: 0 auto 16px; animation: sp 1s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
dialog { border: 0; border-radius: 16px; padding: 0; width: min(720px, calc(100vw - 24px)); max-height: calc(100vh - 40px); box-shadow: 0 20px 60px rgba(20,32,47,.25); }
dialog::backdrop { background: rgba(20,32,47,.45); }
dialog .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; }
dialog .hd h3 { margin: 0; font-size: 18px; }
dialog .bd { padding: 16px 18px 20px; font-size: 15px; }
footer { max-width: 1240px; margin: 0 auto; padding: 18px 20px 36px; color: var(--ink-3); font-size: 13px; }
.mode { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.mode button { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; min-height: 72px; cursor: pointer; color: var(--ink); min-width: 0; }
.mode button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.mode .t { font-size: 13.5px; font-weight: 700; } .mode .n { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.4px; } .mode .s { font-size: 12px; opacity: .8; }
.mode .n { white-space: nowrap; }
.hbtn { display: inline-flex; align-items: center; margin-left: 6px; padding: 2px 8px; min-height: 26px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--navy-2); font-size: 12px; font-weight: 600; cursor: pointer; vertical-align: middle; white-space: nowrap; line-height: 1.2; letter-spacing: 0; }
.hbtn:hover, .hbtn:focus-visible { border-color: var(--navy-2); background: var(--navy-wash); }
.help-tbl td { font-size: 15px; line-height: 1.55; vertical-align: top; } .help-tbl td:first-child { width: 36%; font-weight: 600; color: var(--ink); }
@media (max-width: 520px) { .mode { gap: 6px; } .mode button { padding: 8px 9px; } .mode .t { font-size: 12.5px; } .mode .n { font-size: 17px; } .mode .s { font-size: 11px; } }
.nl { display: grid; gap: 8px; }
@media (min-width: 900px) { .nl { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.nl .it { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; min-width: 0; }
.nl .r1 { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; margin-bottom: 2px; }
.nl .nm { font-weight: 700; font-size: 15px; min-width: 0; }
.nl .mt { font-size: 13px; color: var(--ink-2); }
@media (max-width: 520px) { header.top .in { padding: 14px 16px; } header.top h1 { font-size: 19px; } main { padding: 16px 16px 8px; } .card { padding: 15px; } .kpi .v { font-size: 28px; } .ph h2 { font-size: 20px; } .tile .v { font-size: 20px; } .filters { padding: 12px; } .filters label { flex: 1 1 140px; } footer { padding: 16px; } }
</style>
</head>

  <div><h1>B2B 통합 KPI 대시보드</h1><div class="sub">영업활동 → 기술지원(L3) → 공고·낙찰 → 자재 매출 흐름</div></div>

    go((location.hash.match(/p=([a-z]+)/) || [])[1] || store('b2bdash.tab') || 'home');
  }
  function load(force) {
    var rb = $('#reload'); if (rb) { rb.disabled = true; rb.textContent = '계산 중…'; }
    if (!D) showState('통합시트에서 불러오는 중', '로그인한 구글 계정의 권한으로 시트를 읽고 KPI를 계산합니다. 시트가 바뀐 뒤 처음 열면 1~2분 걸릴 수 있습니다.', '', true);
    if (window.__TEST_RESPONSE__) { setTimeout(function () { render(window.__TEST_RESPONSE__); }, 0); return; }
    google.script.run.withSuccessHandler(render).withFailureHandler(function (err) { if (D && R) { R.status = 'stale'; R.warning = '새로고침 실패: ' + (err && err.message || err); render(R); } else render({ ok: false, message: String(err && err.message || err) }); }).getDashboard(!!force);
  }
  var inGas = typeof google !== 'undefined' && google.script && google.script.run;
  if (window.__TEST_RESPONSE__ || inGas) load(false);
  else { setStat('err', '<span class="pill err"><i></i>미연결</span>'); showState('구글 계정 인증이 필요합니다', '이 파일에는 데이터가 들어 있지 않습니다. 통합시트 열람 권한이 있는 구글 계정으로 아래 웹앱을 열면 실제 시트 데이터를 읽어 표시합니다.', /^https:/.test(WEBAPP_URL) ? '<a class="btn primary" href="' + esc(WEBAPP_URL) + '" target="_blank" rel="noopener">대시보드 열기(구글 로그인)</a>' : '<p class="note">웹앱 주소가 아직 설정되지 않았습니다.</p>'); }
})();
